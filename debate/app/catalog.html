<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contraponto — Biblioteca de Animações</title><style>
:root{font:15px system-ui,Arial;color:#e8edf8;background:#10111b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% 0,#23334a,#10111b 65%)}header{padding:24px max(20px,5vw);border-bottom:1px solid #384052;display:flex;align-items:center;gap:24px;flex-wrap:wrap}h1{font-size:1.6rem;margin:0}header a{margin-left:auto;color:#c4d4ff}p,small{color:#a9b2c7}main{max-width:1100px;margin:auto;padding:22px}label{display:block;margin-bottom:8px;color:#b4c1d8;font-size:13px}select,button{border:1px solid #4c5c73;background:#1d2740;border-radius:9px;color:#fff;padding:11px 13px;cursor:pointer}select{width:100%}.controls{display:grid;grid-template-columns:1fr auto auto;gap:10px;margin-bottom:16px}.viewer{display:grid;place-items:center;min-height:340px;background:linear-gradient(45deg,#172139 25%,#212c40 25%,#212c40 50%,#172139 50%,#172139 75%,#212c40 75%);background-size:24px 24px;border:1px solid #3e536c;border-radius:16px;overflow:hidden}.viewer img{object-fit:contain;image-rendering:pixelated;max-width:100%;max-height:420px;width:auto;height:auto}.filmstrip{display:flex;gap:8px;overflow:auto;padding:14px 0}.filmstrip button{padding:5px;min-width:90px;display:grid;justify-items:center;gap:4px}.filmstrip img{height:72px;max-width:110px;object-fit:contain;image-rendering:pixelated}.filmstrip button.current{border-color:#ffcf7a;background:#453723}.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px}.meta b{color:#fff}footer{border-top:1px solid #333f59;margin-top:28px;padding:20px;color:#b8c5d9}@media(max-width:600px){.controls{grid-template-columns:1fr auto}.controls label{grid-column:1/-1}.viewer{min-height:260px}.viewer img{max-height:330px}}
</style></head><body><header><div><h1>▣ Biblioteca de animações</h1><p>16 animações transparentes v22 · Lia, Dante e Juiz Elias</p></div><a href="/">← Voltar à arena</a></header><main><div class="controls"><label>Sequência<select id="track" aria-label="Selecionar animação"></select></label><button id="play" type="button">Ⅱ Pausar</button><button id="restart" type="button">↺ Reiniciar</button></div><div class="viewer"><img id="hero" alt="Quadro atual"></div><div class="meta"><b id="title">Carregando…</b><span id="count">0/0</span></div><div id="strip" class="filmstrip" aria-label="Quadros da sequência"></div><footer>Os 16 novos estados de Lia e Dante vêm de <code>/assets/actors-v22/manifest.json</code>; Elias permanece em <code>/assets/trio/manifest.json</code>.</footer></main><script type="module">
const $=id=>document.getElementById(id);const assetUrl=s=>s.startsWith('actors-v22/')?'/assets/'+s:'/assets/trio/'+s;let sequences={},key='',frame=0,playing=true,timer=0;
function render(){const seq=sequences[key]||[];if(!seq.length)return;frame=(frame+seq.length)%seq.length;$('hero').src=assetUrl(seq[frame].frame);$('title').textContent=key;$('count').textContent=`${frame+1} / ${seq.length} · ${seq[frame].duration_ms} ms`;
 [...$('strip').children].forEach((el,i)=>el.classList.toggle('current',i===frame));}
function schedule(){clearTimeout(timer);if(!playing)return;const seq=sequences[key];if(!seq?.length)return;timer=setTimeout(()=>{frame++;render();schedule()},seq[frame].duration_ms)}
function select(value){key=value;frame=0;$('strip').replaceChildren();(sequences[key]||[]).forEach(({frame:src},i)=>{const b=document.createElement('button');b.type='button';const image=new Image();image.loading='lazy';image.src=assetUrl(src);b.append(image);const t=document.createElement('small');t.textContent=String(i+1);b.append(t);b.onclick=()=>{frame=i;render();schedule()};$('strip').append(b)});render();schedule()}
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Ⅱ Pausar':'▶ Reproduzir';schedule()};$('restart').onclick=()=>{playing=true;frame=0;$('play').textContent='Ⅱ Pausar';render();schedule()};$('track').onchange=e=>select(e.target.value);
try{const res=await fetch('/assets/trio/manifest.json');if(!res.ok)throw Error('HTTP '+res.status);const legacy=(await res.json()).animations;const actors=await fetch('/assets/actors-v22/manifest.json');if(!actors.ok)throw Error('HTTP '+actors.status);sequences={...Object.fromEntries(Object.entries(legacy).filter(([k])=>k.startsWith('elias/'))),...(await actors.json()).animations};const opts=Object.keys(sequences).sort();for(const x of opts){const option=new Option(x,x);$('track').add(option)}select(opts[0]);}catch(e){$('title').textContent='Não foi possível carregar o manifesto: '+e.message}
window.addEventListener('pagehide',()=>clearTimeout(timer));</script></body></html>
