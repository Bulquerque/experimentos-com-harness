<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contraponto — Catálogo Offline</title><style>
:root{color-scheme:dark;font-family:system-ui,Segoe UI,Arial,sans-serif;background:#101522;color:#f3ead9}body{margin:0;min-height:100vh;background:radial-gradient(circle at 40% 0,#303958,#101522 55%)}header{padding:22px 5vw;border-bottom:1px solid #40495e;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}a{color:#a5d9ef;text-decoration:none}h1{font-size:clamp(25px,4vw,40px);margin:7px 0}.label{font-size:12px;letter-spacing:2px;color:#d6bd9c}main{max-width:1150px;margin:0 auto;padding:24px 16px 65px}.layout{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:22px}section{background:#192136;border:1px solid #44506a;border-radius:16px;padding:18px}.controls{display:grid;gap:16px}label{display:grid;gap:7px;font-size:13px;color:#d9dedf}select,button{background:#272e45;color:#fff;border:1px solid #65718e;padding:12px;border-radius:8px;cursor:pointer}button{background:#3d5277;font-weight:700}.controls p{color:#b6c1ce;font-size:13px}.frame{height:min(65vh,540px);display:grid;place-items:center;overflow:hidden;border-radius:12px;background:radial-gradient(circle,#253958,#111a2b 70%)}.frame img{max-width:95%;max-height:95%;object-fit:contain;image-rendering:pixelated}.meta{display:flex;gap:12px;justify-content:space-between;align-items:center;font-size:13px;margin-top:13px;color:#ddd}.note{font-size:13px;color:#adb7c8;margin-top:20px}@media(max-width:700px){.layout{grid-template-columns:1fr}.frame{height:320px}}
</style><script src="manifest.js" defer></script><script defer src="catalog.js"></script></head><body><header><div><span class="label">CONTRAPONTO / LABORATÓRIO</span><h1>Catálogo de animações</h1></div><a href="../index.html">← VOLTAR À ARENA</a></header><main><div class="layout"><section class="controls"><label>PERSONAGEM<select id="person"><option value="lia">Lia</option><option value="dante">Dante</option><option value="elias">Elias (juiz)</option></select></label><label>SEQUÊNCIA<select id="track"></select></label><button id="play">▶ REPRODUZIR</button><button id="stop">Ⅱ PARAR</button><p>16 novas animações transparentes de Lia e Dante; juiz Elias preservado. Tudo funciona offline, sem API.</p><p><b id="track-count">—</b></p></section><section><div class="frame"><img id="frame" alt="Quadro de sprite selecionado"></div><div class="meta"><b id="caption">—</b><span id="progress">—</span></div></section></div><p class="note">Catálogo para inspecionar frames e duração; estes arquivos são os mesmos usados pelo Debate Singular.</p></main></body></html>
